apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: gcr.io/dwk-gke-509503/ping-pong
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:example@postgres-svc:5432/postgres"