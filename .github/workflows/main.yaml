name: Release Project

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-repository
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "${{ env.GKE_CLUSTER }}"
          project_id: "${{ env.PROJECT_ID }}"
          location: "${{ env.GKE_ZONE }}"

      - name: Form the image names
        run: |-
          echo "FRONTEND_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-frontend:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "BACKEND_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "JOB_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/create-wiki-todo-job:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: |-
          docker build --tag $FRONTEND_TAG todo-app/front
          docker build --tag $BACKEND_TAG todo-app/back
          docker build --tag $JOB_TAG todo-app/jobs/CreateWikiTodoJob

      - name: Publish
        run: |-
          docker push $FRONTEND_TAG
          docker push $BACKEND_TAG
          docker push $JOB_TAG

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |-
          cd todo-app/manifests-gke
          kustomize edit set image gcr.io/$PROJECT_ID/todo-frontend=$FRONTEND_TAG
          kustomize edit set image gcr.io/$PROJECT_ID/todo-backend=$BACKEND_TAG
          kustomize edit set image gcr.io/$PROJECT_ID/create-wiki-todo-job=$JOB_TAG
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/todo-backend-dep -n project
          kubectl rollout status deployment/todo-frontend-dep -n project
          kubectl get services -o wide -n project
