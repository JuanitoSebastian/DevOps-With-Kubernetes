name: Release Project - Production

on:
  push:
    tags:
      - "*"
    paths:
      - "todo-app/**"

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-repository
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-commit:
    name: Build, Publish and Update Manifests
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Form the image names
        run: |-
          echo "FRONTEND_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-frontend:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "BACKEND_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "JOB_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/create-wiki-todo-job:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "BROADCASTER_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: |-
          docker build --tag $FRONTEND_TAG todo-app/front
          docker build --tag $BACKEND_TAG todo-app/back
          docker build --tag $JOB_TAG todo-app/jobs/CreateWikiTodoJob
          docker build --tag $BROADCASTER_TAG todo-app/broadcaster

      - name: Publish
        run: |-
          docker push $FRONTEND_TAG
          docker push $BACKEND_TAG
          docker push $JOB_TAG
          docker push $BROADCASTER_TAG

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "${{ env.GKE_CLUSTER }}"
          project_id: "${{ env.PROJECT_ID }}"
          location: "${{ env.GKE_ZONE }}"

      - name: Set up SOPS
        uses: nhedger/setup-sops@v3
        with:
          version: "3.10.2"

      - name: Apply database secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |-
          kubectl create namespace production || true
          sops --decrypt todo-app/manifests/postgres/todo-db-secret.enc.yaml | kubectl apply -n production -f -

      - name: Apply broadcaster telegram secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |-
          sops --decrypt todo-app/manifests-gke/base/broadcaster-secret.enc.yaml | kubectl apply -n production -f -

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tags in kustomization
        run: |-
          cd todo-app/manifests-gke/overlays/production
          kustomize edit set image PROJECT/TODO-FRONTEND=$FRONTEND_TAG
          kustomize edit set image PROJECT/TODO-BACKEND=$BACKEND_TAG
          kustomize edit set image PROJECT/CREATE-WIKI-TODO-JOB=$JOB_TAG
          kustomize edit set image PROJECT/BROADCASTER=$BROADCASTER_TAG

      - name: Commit kustomization.yaml back to repo
        uses: EndBug/add-and-commit@v9
        with:
          add: "todo-app/manifests-gke/overlays/production/kustomization.yaml"
          message: "New todo-app production version! ${{ github.ref_name }} ${{ github.sha }}"
