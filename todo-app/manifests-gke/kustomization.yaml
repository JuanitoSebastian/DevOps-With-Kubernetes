apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: project

resources:
  - postgres/todo-db-configmap.yaml
  - postgres/todo-db-service.yaml
  - postgres/todo-db-statefulset.yaml
  - postgres/db-check-job.yaml
  - postgres/todo-db-backup-cronjob.yaml
  - nats-configmap.yaml
  - broadcaster-deployment.yaml
  - todo-backend-deployment.yaml
  - todo-backend-service.yaml
  - todo-frontend-deployment.yaml
  - todo-frontend-service.yaml
  - create-wiki-todo-cronjob.yaml
  - pvc.yaml
  - gateway.yaml
  - httproute.yaml

images:
  - name: PROJECT/TODO-FRONTEND
    newName: europe-north1-docker.pkg.dev/dwk-gke-509503/my-repository/todo-frontend
  - name: PROJECT/TODO-BACKEND
    newName: europe-north1-docker.pkg.dev/dwk-gke-509503/my-repository/todo-backend
  - name: PROJECT/BROADCASTER
    newName: europe-north1-docker.pkg.dev/dwk-gke-509503/my-repository/broadcaster
  - name: PROJECT/CREATE-WIKI-TODO-JOB
    newName: europe-north1-docker.pkg.dev/dwk-gke-509503/my-repository/create-wiki-todo-job