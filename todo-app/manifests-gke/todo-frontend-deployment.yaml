apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend-dep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-frontend
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      volumes:
        - name: header-image
          persistentVolumeClaim:
            claimName: todo-image-claim
      containers:
        - name: todo-frontend
          image: PROJECT/TODO-FRONTEND
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 5
          env:
            - name: PORT
              value: "3001"
            - name: TODO_BACKEND_URL
              value: http://todo-backend-svc:2345
            - name: HEADER_IMAGE_DIR
              value: /usr/src/todo-frontend/header-image
            - name: IMAGE_MAX_AGE_MINUTES
              value: "10"
            - name: HEADER_IMAGE_URL
              value: https://picsum.photos/1200
          volumeMounts:
            - name: header-image
              mountPath: /usr/src/todo-frontend/header-image