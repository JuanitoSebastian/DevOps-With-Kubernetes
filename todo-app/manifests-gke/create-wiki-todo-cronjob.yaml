apiVersion: batch/v1
kind: CronJob
metadata:
  name: create-wiki-todo
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: create-wiki-todo
              image: PROJECT/CREATE-WIKI-TODO-JOB
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              envFrom:
                - configMapRef:
                    name: todo-db-config
                - secretRef:
                    name: todo-db-secret
          restartPolicy: Never