apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-db-backup
spec:
  # Once per 24 hours, at midnight UTC
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: todo-db-backup
              image: google/cloud-sdk:alpine
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk add --no-cache postgresql-client
                  TIMESTAMP=$(date +%F)
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h "$DB_HOST" -U "$POSTGRES_USER" "$POSTGRES_DB" > "/tmp/backup-$TIMESTAMP.sql"
                  gcloud auth activate-service-account --key-file=/etc/secrets/key.json
                  gsutil cp "/tmp/backup-$TIMESTAMP.sql" "gs://$BUCKET_NAME/"
              envFrom:
                - configMapRef:
                    name: todo-db-config
                - secretRef:
                    name: todo-db-secret
              env:
                - name: BUCKET_NAME
                  value: juanito-dwk-todo-backups
              volumeMounts:
                - name: sa-key-volume
                  mountPath: /etc/secrets
                  readOnly: true
          volumes:
            - name: sa-key-volume
              secret:
                secretName: storage-sa-key
