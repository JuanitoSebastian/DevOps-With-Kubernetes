apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: log-pingpong-claim
      containers:
        - name: log-writer
          image: log-output-writer
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        - name: log-responder
          image: log-output-responder
          imagePullPolicy: IfNotPresent
          env:
            - name: PINGPONG_URL
              value: "http://ping-pong-svc:2345/pings"
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
