apiVersion: v1
kind: ConfigMap
metadata:
  name: log-output-config
  namespace: exercises
data:
  MESSAGE: "hello world"
  information.txt: |
    this text is from file
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-pingpong-claim
  namespace: exercises
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
  namespace: exercises
  labels:
    app: log-output
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: log-pingpong-claim
        - name: config
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt
      containers:
        - name: log-writer
          image: log-output-writer:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        - name: log-responder
          image: log-output-responder:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PINGPONG_URL
              value: "http://ping-pong-svc:80/pings"
            - name: GREETER_URL
              value: "http://greeter-svc:80"
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
            - name: config
              mountPath: /usr/src/app/config
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: log-output-svc
  namespace: exercises
spec:
  type: ClusterIP
  selector:
    app: log-output
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
